<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2A55" flood-opacity=".28"/></filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF7A3D"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6FA3"/><stop offset="1" stop-color="#E23F7E"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6DCBFF"/><stop offset="1" stop-color="#3B7BFF"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#F7F7F5" filter="url(#drop)"/>
  <g transform="translate(0 34)">
  <!-- three 16:9 video screens -->
  <rect x="292" y="262" width="480" height="270" rx="44" fill="url(#g1)" transform="rotate(-9 532 397)"/>
  <rect x="256" y="320" width="480" height="270" rx="44" fill="url(#g2)" transform="rotate(4 496 455)"/>
  <rect x="252" y="392" width="520" height="292" rx="48" fill="url(#g3)" filter="url(#soft)"/>
  <!-- arrow lands on the playback bar -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 428 V566" stroke-width="64"/>
    <path d="M432 498 L512 578 L592 498" stroke-width="64"/>
    <path d="M304 632 H720" stroke-width="18" stroke-opacity=".45"/>
